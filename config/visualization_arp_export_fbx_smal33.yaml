# ARP retarget -> per-clip full skinned FBX export.
#
# Scans one or more source directories (paired .fbx + .bvh per action), remaps
# onto one target character using a .bmap preset, and writes one output FBX
# per action using the same basename as the source file.
#
# Run (server Blender 4.5.3):
#   python visualization/batch_arp_export_fbx_smal33.py \
#     --config config/visualization_arp_export_fbx_smal33.yaml \
#     --blender blender \
#     --arp_addon_modules auto_rig_pro-master

job_id: lihua1_Planet_Zoo_FBX-cleaned_fbx
# Directory that receives one FBX per source clip (same basename as source).
output_dir: ./datasets/shepherd/cat_actions/train_char

assets:
  recursive_fbx_search: false

fbx_export:
  # Embed image textures into the FBX when possible.
  embed_textures: true
  add_leaf_bones: false
  # Blender FBX axis convention (matches common DCC imports).
  axis_forward: "-Z"
  axis_up: "Y"
  # Output FBX basename matches the source action file stem
  # (e.g. sand_cat_male@jump5m.bvh -> sand_cat_male@jump5m.fbx).
  skip_existing: false

arp:
  use_source_fbx: true
  use_target_bvh: true
  source_armature_hint: null
  target_armature_hint: null
  # Prefer an explicit path so the correct .bmap is always installed.
  remap_preset_path: ./visualization/arp_presets/remap_preset_to_smal.bmap
  # Optional; defaults to the .bmap file stem when omitted.
  remap_preset_name: remap_preset_to_smal
  operator_sequence:
    - auto_scale
    - build_bones_list
    - import_config_preset
    - retarget

# Single target SMAL33 character (batch2_dogs textured FBX).
target:
  tgt_bvh_path: ./datasets/shepherd/batch3_dogs/batch3_dogs_char/lihua/lihua_1_lihua-0.bvh
  # Optional; null resolves to same-stem .fbx next to the BVH.
  tgt_fbx_path: null

# Source action directories. Each action should have matching .bvh + .fbx
# (same stem). Only files directly under each directory are scanned.
# Accepts either:
#   source_dir: ./path/to/one_dir
# or a list:
#   source_dir:
#     - ./path/to/dir_a
#     - ./path/to/dir_b
# (source_dirs is also accepted as an alias for the list form.)
