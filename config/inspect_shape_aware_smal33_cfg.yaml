# Stage-2 shape-aware SMAL33 visual inspection (phase B).
device: 0
self_recon: false
view_mode: root_centered
compare_spacing: 2.0
mesh_spacing: 3.0
show_target_rest: true
show_stage1_mesh: false
frame_margin: 0.08

# Camera: zoom in with camera_zoom>1; orbit with view_elev / view_azim (degrees).
# Example head-on view: view_elev: 12, view_azim: 135, camera_zoom: 1.8
camera_zoom: 1.0
view_elev: 18.0
view_azim: -75.0

# Mesh: stride=1 renders full solid skin; increase stride only if export is too slow.
mesh_face_stride: 1
mesh_alpha: 1.0
mesh_shade: true
fps: 30

# stage1_weights only required when show_stage1_mesh: true
stage1_weights: ./work_dir/train_skeleton_aware_smal33/r2et_skeleton_aware_smal33_ret-96.pt
stage2_weights: ./work_dir/train_shapeaware_smal33/r2et_shape_aware_smal33_ret-12.pt
mesh_path: ./datasets/Planet_Zoo_FBX-smal2/train_shape
save_path: ./work_dir/train_shapeaware_smal33/inspect

ret_model_args:
  num_joint: 33
  token_channels: 64
  hidden_channels_p: 256
  embed_channels_p: 128
  kp: 0.8

load_inp_data:
  inp_shape_path: ./datasets/Planet_Zoo_FBX-smal2/train_shape/west_african_lion_female.npz
  tgt_shape_path: ./datasets/Planet_Zoo_FBX-smal2/train_shape/sand_cat_male.npz
  stats_path: ./datasets/Planet_Zoo_FBX-smal2/stats
  inp_bvh_path: ./datasets/Planet_Zoo_FBX-smal2/train_char/west_african_lion_female/west_african_lion_female@runtowalkturnl.bvh
  tgt_bvh_path: ./datasets/Planet_Zoo_FBX-smal2/train_char/sand_cat_male/sand_cat_male@climbbeam.bvh
