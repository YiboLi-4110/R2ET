# Stage-1 skeleton-aware visual inspection for smal@shepherd / batch2_dogs.
weights: ./work_dir/train_smal@shepherd_dog_batch_dogs_skeleton_aware_smal33/r2et_shepherd_skeleton_aware_smal33_ret-118.pt
save_path: ./work_dir/train_smal@shepherd_dog_batch_dogs_skeleton_aware_smal33/inspect
# weights: ./work_dir/train_smal@shepherd_cat_batch_dogs_skeleton_aware_smal33/r2et_shepherd_skeleton_aware_smal33_ret-106.pt
# save_path: ./work_dir/train_smal@shepherd_cat_batch_dogs_skeleton_aware_smal33/inspect
device: 0
self_recon: false
view_mode: root_centered
compare_spacing: 2.0
show_target_rest: true
frame_margin: 0.08

ret_model_args:
  num_joint: 33
  token_channels: 64
  hidden_channels_p: 256
  embed_channels_p: 128
  kp: 0.8

load_inp_data:
  # stats_path: ./datasets/shepherd/stats_cat  
  # inp_shape_path: ./datasets/shepherd/smal@shepherd_cat/train_shape/Crouch.npz
  # tgt_shape_path: ./datasets/shepherd/batch_dogs/batch_dogs_shape/lihua_hair_remesh0830-0.npz
  # inp_bvh_path: ./datasets/shepherd/smal@shepherd_cat/train_char/Crouch/Crouch_BL_RM.bvh
  # tgt_bvh_path: ./datasets/shepherd/batch_dogs/batch_dogs_char/lihua/lihua_hair_remesh0830-0.bvh
  stats_path: ./datasets/shepherd/stats_dog
  inp_shape_path: ./datasets/shepherd/smal@shepherd_dog/train_shape/shepherd@Crouch.npz
  tgt_shape_path: ./datasets/shepherd/batch_dogs/batch_dogs_shape/hashiqi_dog_remesh-0.npz
  inp_bvh_path: ./datasets/shepherd/smal@shepherd_dog/train_char/shepherd@Crouch/shepherd@Crouch_BL_RM_smal_dog-foot_on_ground.bvh
  tgt_bvh_path: ./datasets/shepherd/batch_dogs/batch_dogs_char/hashiqi/hashiqi_dog_remesh-0.bvh
  inp_axis_transform: shepherd_y_z_x
  inp_forward_mode: body
  # Set to 90 after re-preprocessing ARP cat / batch2 with --post_axis_yaw_deg 90.
  # inp_post_axis_yaw_deg: 0
  tgt_axis_transform: shepherd_y_z_x
  tgt_forward_mode: body
  # tgt_post_axis_yaw_deg: 0
