# Stage-1 skeleton-aware visual inspection for smal@shepherd / batch2_dogs.
weights: ./work_dir/train_shepherd_skeleton_aware_smal33/r2et_shepherd_skeleton_aware_smal33_ret-168.pt
save_path: ./work_dir/train_shepherd_skeleton_aware_smal33/inspect
device: 0
self_recon: false
view_mode: root_centered
compare_spacing: 2.0
show_target_rest: true
frame_margin: 0.08

ret_model_args:
  num_joint: 33
  token_channels: 64
  hidden_channels_p: 256
  embed_channels_p: 128
  kp: 0.8

load_inp_data:
  stats_path: ./datasets/shepherd/stats
  inp_shape_path: ./datasets/shepherd/smal@shepherd/train_shape/shepherd@Run.npz
  # inp_shape_path: ./datasets/shepherd/smal@shepherd/train_shape/shepherd@Crouch.npz
  tgt_shape_path: ./datasets/shepherd/batch2_dogs/batch2_dogs_shape/博美_3-0.npz
  inp_bvh_path: ./datasets/shepherd/smal@shepherd/train_char/shepherd@Run/shepherd@Run_F_RM_smal_dog-foot_on_ground.bvh
  # inp_bvh_path: ./datasets/shepherd/smal@shepherd/train_char/shepherd@Crouch/shepherd@Crouch_B_RM_smal_dog-foot_on_ground.bvh
  tgt_bvh_path: ./datasets/shepherd/batch2_dogs/batch2_dogs_char/博美/博美_3-0.bvh
  inp_axis_transform: shepherd_y_z_x
  inp_forward_mode: body
  tgt_axis_transform: shepherd_y_z_x
  tgt_forward_mode: body
