# ARP / direct / R2ET multi-clip sequence render.
# Keeps camera / floor / lighting knobs aligned with visualization_compare_smal33.yaml.
#
# Run ARP (server Blender 4.5.3):
#   python visualization/batch_arp_sequence_smal33.py \
#     --config config/visualization_arp_sequence_smal33.yaml \
#     --blender blender \
#     --arp_addon_modules auto_rig_pro-master \
#     --retarget_mode arp
#
# Run same-skeleton direct copy (no ARP addon):
#   python visualization/batch_arp_sequence_smal33.py \
#     --config config/visualization_arp_sequence_smal33.yaml \
#     --blender blender \
#     --retarget_mode direct
#
# Run R2ET (stage1 / stage2 / blend; no ARP for mesh export):
#   python visualization/batch_arp_sequence_smal33.py \
#     --config config/visualization_arp_sequence_smal33.yaml \
#     --blender blender \
#     --retarget_mode r2et \
#     --stage2_mode stage1

output_root: ./visualization/videos/arp_sequence
sequence_id: bianmu_3_forpkl_selected_dog_actions_demo_1
device: 0

camera:
  camera_zoom: 10.0
  view_elev: 18.0
  view_azim: -60.0

render:
  render_engine: eevee # eevee | cycles
  resolution_x: 1920
  resolution_y: 1080
  fps: 21
  frame_step: 1
  camera_distance_scale: 1.5
  camera_lens_mm: 83.0
  # Optional absolute camera control (set to [x, y, z]); null uses auto camera.
  camera_position_xyz: [11.5, 1.5, 2.5]
  camera_target_xyz: [0.0, 0.0, 0.9]
  layout_center_xyz: null
  # Character size in the frame (1.0 = LBS native). Scales about the floor so
  # ground contact stays put. With source.match_target_height, keep both lanes
  # on the SAME display scale (do not bump source alone to 3x).
  # mesh_scale: 1.4
  mesh_scale_by_lane: {source: 1.6, retarget: 1.4}
  show_lane_label: false
  lane_label_size: 0.35
  lane_label_z: 1.6
  lane_label_z_offset: 0.25
  lane_label_color: [1.0, 0.0, 0.0, 1.0]
  # Top-left HUD: current clip BVH stem (no .bvh). Pause inherits held clip.
  show_action_label: true
  action_label_color: [0.08, 0.08, 0.08, 1.0]
  action_label_size_frac: 0.04
  action_label_margin_x: 0.035
  action_label_margin_y: 0.04
  # Flat preview for clear motion delivery: no floor, no sun/fill shadows.
  # Set false to restore the previous lit + checker-floor look.
  simple_preview: true
  # Slightly darker than the cream clay so Source reads as a solid silhouette.
  simple_preview_bg_rgb: [0.26, 0.26, 0.28]
  simple_preview_world_strength: 1.0
  # Legacy lit-floor knobs (used only when simple_preview=false).
  sun_light_position_xyz: [20.0, 20.0, 60.0]
  sun_light_rotation_deg: [55.0, -20.0, 40.0]
  sun_light_energy: 6.5
  fill_light_position_xyz: [0.0, 0.0, 18.0]
  fill_light_energy: 600.0
  fill_light_size: 20.0
  lbs_use_fbx_materials: true
  # ARP mesh is converted to LBS Y-up before render; then Y-up -> Blender Z-up.
  lbs_axis_transform: y_up_to_z_up
  lbs_global_yaw_deg: -65.0
  lbs_lane_yaw_deg_default: 0.0
  lbs_lane_yaw_deg:
    source: 0.0
    retarget: 0.0
    arp: 0.0
  # Used when sequence.show_source / --show_source is enabled (Source | Retarget).
  lane_spacing: 2.1
  # Source lane material (simple_preview):
  #   wireframe — original: bright fill + triangle edges
  #   shaded    — clay volume (side light + AO + rim), no triangle edges
  #   emission  — uniform unlit color
  #   solid     — Principled BSDF
  source_material_mode: shaded
  # Warm cream vs darker gray bg; shade much darker so volume does not wash out.
  source_material_color: [0.98, 0.96, 0.90, 1.0]
  source_shade_color: [0.16, 0.16, 0.18, 1.0]
  source_emission_strength: 1.7
  # shaded-only volume knobs (ignored by wireframe):
  # Blender Z-up: key from above + slight camera-right (not from below).
  source_key_light_dir: [0.32, -0.22, 0.92]
  source_key_light_wrap: 0.32
  source_ao_distance: 0.18
  source_ao_factor: 0.72
  source_rim_strength: 0.18
  source_volume_contrast: 1.9
  source_shaded_emission_strength: 1.08
  source_wire_color: [0.02, 0.02, 0.03, 1.0]
  source_wire_emission_strength: 2.5
  source_wire_size: 1.3
  source_wire_pixel_size: true
  source_form_blend: 0.52
  add_floor: false
  auto_align_floor: true
  floor_z: 0.0
  floor_size: 40.0
  floor_checker_scale: 24.0
  floor_rotation_deg: 30.0

sequence:
  # arp: Auto-Rig Pro remap (cross-skeleton / different bone axes OK)
  # direct: CopyQuat same-skeleton (fourway-compatible; no Blender/ARP)
  # r2et:   R2ET stage1/stage2/blend + LBS (needs source/target shape + weights)
  retarget_mode: arp
  # Side-by-side Source skinned mesh (fourway Source lane). Also: --show_source / --no_show_source
  show_source: false
  # Hold frames inserted between consecutive source clips.
  pause_frames: 18
  # hold_last: repeat last frame of previous clip
  # hold_first: repeat first frame of next clip
  pause_mode: hold_last
  # If true, skip retarget step when clip mesh cache already exists.
  skip_arp_if_exists: false
  skip_retarget_if_exists: false

# Same axis convention as visualization_compare / R2ET inference.
motion:
  # inp/tgt share shepherd_y_z_x + body (same as fourway). Cat_actions still
  # needs an extra -90° yaw after that transform: file Y is "forward" (the axis
  # you see as ±Z in Blender), so shepherd_y_z_x parks rest facing +X. Without
  # -90, canonicalize_bind_pose yaws rest offsets but not child local quats —
  # seq stays sagittal while CopyQuat FK swings left/right. 180 only flips
  # heading and does NOT fix that plane swap. smal@shepherd fourway clips
  # already face +Z after shepherd_y_z_x (no extra yaw; leave 0 there).
  inp_axis_transform: shepherd_y_z_x # 如果使用游戏解包动作，替换为none
  inp_forward_mode: body # 如果使用游戏解包动作，替换为across
  # inp_post_axis_yaw_deg: -90
  tgt_axis_transform: shepherd_y_z_x
  tgt_forward_mode: body

# Source shape root for R2ET / show_source (per-clip .npz from BVH stem/folder).
# Used when sources[] omit inp_shape_path.
source:
  train_shape: ./datasets/shepherd/smal@shepherd/train_shape
  # auto | lbs | blender — SMAL33 defaults to lbs under auto.
  skin_backend: auto
  # Keep root motion so Source matches the real BVH travel / turns.
  apply_root_translation: xz
  apply_root_yaw: true
  # Scale Source rest size to the target dog BEFORE baking root motion, so
  # cat vs lihua look similar without mesh_scale_by_lane.source >> 1.
  # size_mode: length (body Z, ~3.3x for sand_cat→lihua) | height (Y) | max_extent
  # Re-export source_mesh caches after toggling this.
  match_target_height: true
  match_target_size_mode: length
  # Side-by-side Source lane: per-frame bbox horizontal lock (same knob as retarget).
  # Default false — locking AABB center causes Idle/limb jitter on Source.
  mesh_lock_horizontal_translation: false
  mesh_lock_reference: first

# CopyQuat direct path (sequence.retarget_mode=direct).
direct:
  # Target bind-pose mesh+skin weights (auto-resolves <bvh_stem>.npz if null).
  # LBS rest skeleton comes from this npz (canonicalized to +Z with BVH), not BVH alone.
  shape_root: ./datasets/shepherd/batch3_dogs/batch3_dogs_shape
  # Scale root translation by skeleton height ratio (same as fourway CopyQuat).
  scale_root_translation: true
  # Bake world locomotion onto the LBS mesh. Default was pose-only (in-place).
  # Code default is still false/false if these keys are omitted.
  #   xz  = horizontal travel only (does not change floor height vs template dog)
  #   yaw = heading from seq rvelocity (turns / arcs)
  # Keep mesh_lock_horizontal_translation false, or travel will be cancelled.
  apply_root_translation: xz
  apply_root_yaw: true
  # Local-quat change of basis before CopyQuat (not mesh yaw).
  # Fourway CopyQuat does NOT apply this. With matched shepherd_y_z_x/body on
  # both sides, bone offsets already align with LBS; yaw_180 was a band-aid for
  # the old asymmetric none↔shepherd_y_z_x setup. Keep identity unless a
  # specific clip still needs it after axis alignment.
  copyquat_quat_basis: identity
  mesh_orientation_correction: identity
  mesh_lock_horizontal_translation: false
  mesh_lock_reference: first

# R2ET path (sequence.retarget_mode=r2et). Mesh caches use space=lbs_y_up like direct.
r2et:
  # Optional override of source.train_shape (SOURCE shapes only).
  # train_shape: ./datasets/shepherd/smal@shepherd/train_shape
  # Target shape root (TARGET dogs). Distinct from train_shape above.
  # shape_root: ./datasets/shepherd/batch3_dogs/batch3_dogs_shape
  mesh_orientation_correction: identity
  mesh_lock_horizontal_translation: false
  mesh_lock_reference: first

# R2ET model knobs (same semantics as visualization_blend_per_dog_smal33.yaml).
ret_model_args:
  num_joint: 33
  token_channels: 64
  hidden_channels_p: 256
  embed_channels_p: 128
  kp: 0.8
  tail_dof_num: 1

model:
  # Used when stage2.mode == stage1 (pure skeleton-aware RetNet).
  stage1_weights: ./work_dir/train_smal@shepherd_batch3_dogs_skeleton_aware_smal33/r2et_shepherd_skeleton_aware_smal33_ret-118.pt
  # Used when stage2.mode in {stage2, blend} (shape-aware RetNet).
  stage2_weights: ./work_dir/train_smal@shepherd_batch3_dogs_shape_aware_smal33/r2et_shepherd_shape_aware_smal33_ret-95.pt
  stats_path: ./datasets/shepherd/stats

# Inference (r2et mode only):
#   stage1 -> load model.stage1_weights (skeleton RetNet); gate_scale ignored
#   stage2 -> load model.stage2_weights; force full gate, k=gate_scale
#   blend  -> load model.stage2_weights; learned gate * gate_scale
stage2:
  mode: blend
  gate_scale: 1.5

arp:
  output_dir: ./visualization/videos/arp_sequence/arp_outputs
  output_suffix: _arp_retarget.bvh
  mesh_output_dir: ./visualization/videos/arp_sequence/arp_mesh_outputs
  mesh_export_space: world_root_h_locked_zup
  # No CopyQuat/Ours reference in this pipeline; keep a fixed mode.
  # choices: identity | yaw_180 | mirror_x | mirror_z
  mesh_orientation_correction: identity
  mesh_lock_horizontal_translation: false
  mesh_lock_reference: first
  use_source_fbx: true
  use_target_bvh: true
  source_armature_hint: null
  target_armature_hint: null
  remap_preset_name: smal33_to_smal33
  operator_sequence:
    - auto_scale
    - build_bones_list
    - import_config_preset
    - retarget

assets:
  recursive_fbx_search: false

# Single target SMAL33 character (batch2_dogs).
target:
  tgt_bvh_path: ./datasets/shepherd/batch3_dogs/batch3_dogs_char/bianmu/bianmu_3_dog_forpkl-0.bvh
  # Optional; null resolves to same-stem .fbx next to the BVH.
  tgt_fbx_path: null
  # Optional for direct/CopyQuat/R2ET; null resolves via direct/r2et.shape_root/<bvh_stem>.npz
  tgt_shape_path: null

