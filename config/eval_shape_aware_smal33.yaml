# Shape-aware SMAL33 evaluation (phase A: batch metrics on val split).
data_path: ./datasets/Planet_Zoo_FBX-smal2/train_q
shape_path: ./datasets/Planet_Zoo_FBX-smal2/train_shape
mesh_path: ./datasets/Planet_Zoo_FBX-smal2/train_shape
stats_path: ./datasets/Planet_Zoo_FBX-smal2/stats
output_dir: ./work_dir/train_shapeaware_smal33/eval

# All stage-2 checkpoints (every 2 epochs in your run).
checkpoint_glob: ./work_dir/train_shapeaware_smal33/r2et_shape_aware_smal33_ret-*.pt

# Stage-1 init for before/after comparison (set to your training init ckpt).
baseline_checkpoint: ./work_dir/train_skeleton_aware_smal33/r2et_skeleton_aware_smal33_ret-96.pt

max_length: 32
min_frames: 32
val_ratio: 0.1
seed: 3047
num_self_samples: 100
num_cross_pairs: 100
device: 0

# Match training geo settings for comparable RDF numbers.
sdf_grid_size: 20
geo_frame_stride: 4
compute_front_rdf: false

alpha: 100.0
mu: 10.0
euler_ord: yzx

ret_model_args:
  num_joint: 33
  token_channels: 64
  hidden_channels_p: 256
  embed_channels_p: 128
  kp: 0.8
