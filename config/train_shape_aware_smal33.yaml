work_dir: ./work_dir/train_shapeaware_smal33
mesh_path: ./datasets/Planet_Zoo_FBX-smal2/train_shape/
phase: train
alpha: 100.0
mu: 10.0
kappa: 0.5
tao: 0.005
# RDF weights: tail-hind (highest) > hind-torso > front (optional).
w_front: 1.5
w_hind: 3.0
w_tail_hind: 3.5
w_att: 1.0
# Front-leg RDF off by default (rare penetration); use --enable_front_rdf to turn on.
enable_front_rdf: false
# Geometry loss speed knobs (lower/fewer = faster; tail-torso RDF removed).
sdf_grid_size: 24
geo_frame_stride: 2
enable_att_loss: true
kp: 0.8
margin: 0.3
lam: 2.0
euler_ord: yzx
max_length: 32
num_joint: 33
seed: 3047
num_workers: 8

train_feeder_args:
  data_path: ./datasets/Planet_Zoo_FBX-smal2/train_q
  stats_path: ./datasets/Planet_Zoo_FBX-smal2/stats
  shape_path: ./datasets/Planet_Zoo_FBX-smal2/train_shape
  max_length: 32
  min_frames: 32
  recompute_stats: false

ret_model_args:
  num_joint: 33
  token_channels: 64
  hidden_channels_p: 256
  embed_channels_p: 128
  kp: 0.8

dis_model_args:
  kp: 0.8

epoch: 50
# Physical GPU id(s). Multi-GPU: list all ids, e.g. [0, 1, 2, 3] or [1, 3].
# Training auto-launches DDP (torchrun). batch_size below is PER GPU.
device: [0]
step: [30]
base_lr: 0.001
batch_size: 16
weight_decay: 0.0
model_save_name: r2et_shape_aware_smal33
# Update these paths to your stage-1 checkpoints before training.
ret_weights: ./work_dir/train_skeleton_aware_smal33/r2et_skeleton_aware_smal33_ret-180.pt
dis_weights: ./work_dir/train_skeleton_aware_smal33/r2et_skeleton_aware_smal33_dis-180.pt
ignore_weights: []
