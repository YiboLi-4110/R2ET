# Stage-1 skeleton-aware eval for smal@shepherd (+ optional batch2_dogs cross).
data_path: ./datasets/shepherd/smal@shepherd/train_q
shape_path: ./datasets/shepherd/smal@shepherd/train_shape
stats_path: ./datasets/shepherd/stats
output_dir: ./work_dir/train_shepherd_skeleton_aware_smal33/eval
checkpoint_glob: ./work_dir/train_shepherd_skeleton_aware_smal33/r2et_shepherd_skeleton_aware_smal33_ret-*.pt

max_length: 32
min_frames: 16
val_ratio: 0.1
seed: 3047
num_self_samples: 200
num_cross_pairs: 200

# External cross: val shepherd motion -> batch2_dogs rest skeleton/shape.
target_data_path: ./datasets/shepherd/batch2_dogs/batch2_dogs_q
target_shape_path: ./datasets/shepherd/batch2_dogs/batch2_dogs_shape
target_min_frames: 2
num_cross_external_pairs: 200

device: 2
alpha: 100.0
nu: 100.0
mu: 10.0
euler_ord: yzx

ret_model_args:
  num_joint: 33
  token_channels: 64
  hidden_channels_p: 256
  embed_channels_p: 128
  kp: 0.8
